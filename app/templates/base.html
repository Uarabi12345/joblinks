<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobLinks — Earn From Your Phone</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav>
    <a href="/" class="brand">💼 JobLinks</a>
    <span class="nav-right">
      {% if user %}
        {% if not user.is_admin %}
          <a href="/profile" style="font-weight: bold; color: #6366f1;">My Profile</a>
        {% endif %}
        <span class="nav-user">{{ user.email }}</span>
        {% if user.is_admin %}<a href="/admin">Admin</a>{% endif %}
        <a href="/logout" class="nav-btn">Logout</a>
      {% else %}
        <a href="/login">Login</a>
        <a href="/register" class="nav-btn">Get Started</a>
      {% endif %}
    </span>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  
  <!-- FLOATING WHATSAPP BUTTON -->
  <a href="https://wa.me/254700000000" class="whatsapp-float" target="_blank" title="Chat with Support">

</html>
