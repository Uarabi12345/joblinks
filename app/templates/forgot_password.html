{% extends "base.html" %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Forgot Password</h2>
      <p>Enter your email and we'll send you a reset code.</p>
    </div>
    
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    
    <form method="post" action="/forgot-password">
      <label>Email</label>
      <input name="email" type="email" required placeholder="you@example.com">

      <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Send Reset Code</button>
    </form>
    
    <p style="text-align: center; margin-top: 20px; font-size: 14px; color: #64748b;">
      Remembered it? <a href="/login" style="color: #6366f1; font-weight: bold;">Login here</a>
    </p>
  </div>
</div>
{% endblock %}
