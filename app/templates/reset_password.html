{% extends "base.html" %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Create New Password</h2>
      <p>Enter the 6-digit code sent to <strong>{{ email }}</strong></p>
    </div>
    
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    
    <form method="post" action="/reset-password">
      <input type="hidden" name="email" value="{{ email }}">
      
      <label>6-Digit Code</label>
      <input name="code" type="text" required placeholder="123456" maxlength="6" style="text-align: center; font-size: 24px; letter-spacing: 5px;">

      <label>New Password</label>
      <div class="password-wrapper">
        <input name="new_password" id="new-password" type="password" required placeholder="••••••••">
        <span class="toggle-password" onclick="togglePassword('new-password')">👁️</span>
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Save New Password</button>
    </form>
  </div>
</div>

<script>
function togglePassword(inputId) {
  const input = document.getElementById(inputId);
  if (input.type === "password") {
    input.type = "text";
  } else {
    input.type = "password";
  }
}
</script>
{% endblock %}
